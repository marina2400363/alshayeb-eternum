<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="The official gateway to ALSHAYEB EXPERIENCE." />
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="ALSHAYEB EXPERIENCE" />
    <meta property="og:description" content="The official gateway to ALSHAYEB EXPERIENCE." />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.jpg" />
    <meta property="og:url" content="https://www.alshayebexperience.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ALSHAYEB EXPERIENCE" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ALSHAYEB EXPERIENCE" />
    <meta name="twitter:description" content="The official gateway to ALSHAYEB EXPERIENCE." />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Michroma&family=Orbitron:wght@400;500;600&family=Rajdhani:wght@300;400;500&display=swap" rel="stylesheet" />
    <!-- Season 2 display + body face (variable: width 75–125, weight 400–900). Font files are fetched only where text actually uses "Archivo", so Season 1 pages are unaffected. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&display=swap" rel="stylesheet" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>ALSHAYEB EXPERIENCE</title>
    <!-- Season 2 homepage preloader: static first paint + page hold. Must match
         src/season2/features/preloader/Preloader.css (black field, hairline track). -->
    <style>
      #s2-boot { position: fixed; inset: 0; z-index: 9999; background: #000; }
      #s2-boot i { position: absolute; left: clamp(20px, 5vw, 56px); right: clamp(20px, 5vw, 56px); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); height: 1px; background: rgba(255, 255, 255, 0.14); }
      html.s2-preloading { overflow: hidden; scrollbar-gutter: stable; background: #000; }
    </style>
    <link href="https://fonts.cdnfonts.com/css/aquire" rel="stylesheet">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- Homepage only: paints the preloader's black field before the app
         bundle has loaded. The React preloader replaces it on mount. -->
    <div id="s2-boot" aria-hidden="true" style="display: none"><i></i></div>
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, "");
        if (path !== "" && path !== "/season2") return;
        var boot = document.getElementById("s2-boot");
        var html = document.documentElement;
        boot.style.display = "block";
        html.classList.add("s2-preloading");
        // Safety: if the app never takes over (e.g. the bundle fails), never
        // leave the visitor on a black screen.
        setTimeout(function () {
          if (!boot.parentNode) return;
          boot.parentNode.removeChild(boot);
          html.classList.remove("s2-preloading");
        }, 20000);
      })();
    </script>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
