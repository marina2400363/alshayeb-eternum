name: Automated Sync Cron
on:
  schedule:
    # BACKUP / reconciliation only. GitHub runs scheduled workflows on a
    # best-effort basis (in practice a few times a day), so nothing depends on
    # this cadence: the accountant's DONE is picked up instantly by the Google
    # Sheets on-edit trigger (backend/apps-script/FullPaymentOnEdit.gs), and the
    # admin's "Sync Full Payment" button is the manual fallback.
    - cron: '*/5 * * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Sync Endpoint
        env:
          # Repository secret: Settings -> Secrets and variables -> Actions.
          # Must equal the CRON_SECRET environment variable on Vercel.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set."
            exit 1
          fi
          # The secret travels only in the header. The status code is checked
          # explicitly so ANY non-2xx (401 wrong secret, 5xx, or a 3xx redirect
          # that would otherwise look like success) fails the run loudly.
          status=$(curl -sS --max-time 60 -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            -o /dev/null -w '%{http_code}' \
            https://www.alshayebexperience.com/api/cron/sync-all)
          echo "sync-all responded HTTP $status"
          case "$status" in
            2??) ;;
            *)
              echo "::error::Cron sync failed: HTTP $status"
              exit 1
              ;;
          esac
